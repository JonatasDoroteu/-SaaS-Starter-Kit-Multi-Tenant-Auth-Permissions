services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_starter
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-only-change-me
      ALGORITHM: HS256
      DATABASE_URL: postgresql+asyncpg://saas:saas-dev-password@postgres:5432/saas_starter
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      NOTIFICATION_SERVICE_URL: http://localhost:3000
      NOTIFICATION_SERVICE_KEY: local-only-change-me
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: